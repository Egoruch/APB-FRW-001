; APB-Firmware - Advanced Power Bank (APB-PCB-001-R01), ESP32-C6
[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 921600

; Physical chip is ESP32-C6FH4 = 4 MB flash (board profile defaults to 8 MB).
board_upload.flash_size = 4MB
; OTA layout with no filesystem -> each OTA app slot ~1.94 MB (more room,
; keeps OTA available for a future feature)
board_build.partitions = ota_nofs_4MB.csv

; LVGL local library resolves lv_conf.h from include/
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1

build_unflags =
    -DCORE_DEBUG_LEVEL=0
